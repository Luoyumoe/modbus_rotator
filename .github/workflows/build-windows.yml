name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest
      - name: Build onefile executable
        run: python -m PyInstaller --clean --noconfirm rotator.spec
      - name: Package artifact
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          Compress-Archive -Path dist/ModbusRotator.exe -DestinationPath "ModbusRotator-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ModbusRotator-windows-x64
          path: ModbusRotator-*-windows-x64.zip

