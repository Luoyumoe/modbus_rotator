[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modbus-rotator"
version = "0.1.0"
description = "PySide6 industrial dashboard for XY-SMH Modbus rotators"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.6",
  "minimalmodbus>=2.1",
  "pyserial>=3.5",
]

[project.scripts]
modbus-rotator = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

